<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotify - Would God Forgive Me If I Only Praise One Deity?</title>
    <!-- Font & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

       
        #playlist-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #3a5a40 0%, #121212 40%);
            overflow-y: auto;
            padding: 30px;
            transition: opacity 0.5s ease;
        }

        .header {
            display: flex;
            align-items: flex-end;
            gap: 25px;
            margin-bottom: 30px;
        }

        .cover-art {
            width: 190px;
            height: 190px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            background-color: #282828;
            flex-shrink: 0;
        }

        .playlist-info h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .playlist-info h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .playlist-info p {
            color: #b3b3b3;
            font-size: 14px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 25px;
        }

        .play-btn {
            width: 56px;
            height: 56px;
            background-color: #1db954;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.05);
            background-color: #1ed760;
        }

        .track-list {
            width: 100%;
            border-collapse: collapse;
        }

        .track-list th {
            text-align: left;
            color: #b3b3b3;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .track-row {
            cursor: pointer;
            transition: background-color 0.2s;
            border-radius: 4px;
        }

        .track-row:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .track-row td {
            padding: 12px 10px;
            color: #b3b3b3;
            font-size: 14px;
        }

        .track-title {
            color: #fff;
            font-weight: 600;
            font-size: 16px;
        }

        .track-artist {
            font-size: 13px;
            color: #b3b3b3;
        }

      
        #player-view {
            display: none;
            flex: 1;
            flex-direction: column;
            background: linear-gradient(180deg, #1c3323 0%, #0a0a0a 100%);
            padding: 20px 40px;
            position: relative;
            overflow: hidden;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            color: #fff;
        }

        .now-playing-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mini-art {
            width: 52px;
            height: 52px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #282828;
            flex-shrink: 0;
        }

       
        #lyrics-viewport {
            flex: 1;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
            padding: 180px 0;
            scrollbar-width: none;
        }

        #lyrics-viewport::-webkit-scrollbar {
            display: none;
        }

        #lyrics-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .lyric-line {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: color 0.4s ease, transform 0.4s ease, filter 0.4s ease;
            transform-origin: left center;
            user-select: none;
        }

        .lyric-line:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .lyric-line.active {
            color: #ffffff;
            transform: scale(1.06);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        .lyric-line.highlight-title {
            color: rgba(29, 185, 84, 0.4);
            font-size: 32px;
        }

        .lyric-line.highlight-title.active {
            color: #1ed760;
            text-shadow: 0 0 25px rgba(30, 215, 96, 0.4);
        }

        .spacer-line {
            height: 20px;
        }

        
        .bottom-bar {
            height: 80px;
            background-color: #000000;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .bar-track-info {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 30%;
        }

        .bar-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .bar-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #b3b3b3;
        }

        .bar-buttons i {
            cursor: pointer;
        }

        .bar-buttons i:hover {
            color: #fff;
        }

        .play-pause-bar {
            font-size: 28px;
            color: #fff;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #b3b3b3;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: #4f4f4f;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #1db954;
        }

        
        @media (max-width: 768px) {
            #playlist-view {
                padding: 20px 16px;
            }

            .header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 15px;
                margin-bottom: 20px;
            }

            .cover-art {
                width: 160px;
                height: 160px;
            }

            .playlist-info h1 {
                font-size: 22px;
                margin-bottom: 8px;
            }

            .controls {
                justify-content: center;
                margin-bottom: 15px;
            }

            
            .track-list th:nth-child(3),
            .track-row td:nth-child(3) {
                display: none;
            }

            #player-view {
                padding: 15px 20px;
            }

            .now-playing-header h2 {
                font-size: 16px !important;
            }

            #lyrics-viewport {
                padding: 120px 0;
            }

            .lyric-line {
                font-size: 20px;
                line-height: 1.35;
            }

            .lyric-line.highlight-title {
                font-size: 22px;
            }

           
            .bottom-bar {
                height: auto;
                padding: 12px 15px;
                flex-direction: column;
                gap: 10px;
            }

            .bar-track-info {
                width: 100%;
                justify-content: flex-start;
            }

            .bar-controls {
                width: 100%;
            }

            .bar-buttons {
                gap: 25px;
            }

            .progress-container {
                font-size: 11px;
            }

            .bottom-bar > div:last-child {
                display: none; /* remove spacer div on mobile */
            }
        }
    </style>
</head>
<body>

    <audio id="music" loop>
        <source src="summer.mp3" type="audio/mpeg">
    </audio>

    
    <div id="playlist-view">
        <div class="header">
            <img src="photo123.jfif" alt="Playlist Cover" class="cover-art">
            <div class="playlist-info">
                <h4>Public Playlist</h4>
                <h1>Would God Forgive Me If I Only Praise One Deity?</h1>
                <p>Created by Shei • 1 song</p>
            </div>
        </div>

        <div class="controls">
            <div class="play-btn" onclick="playTrack()">
                <i class="fa-solid fa-play" style="margin-left: 3px;"></i>
            </div>
        </div>

        <table class="track-list">
            <thead>
                <tr>
                    <th style="width: 35px;">#</th>
                    <th>Title</th>
                    <th>Album</th>
                    <th style="text-align: right;"><i class="fa-regular fa-clock"></i></th>
                </tr>
            </thead>
            <tbody>
                <tr class="track-row" onclick="playTrack()">
                    <td>1</td>
                    <td>
                        <div class="track-title">Summertime Sadness</div>
                        <div class="track-artist">Lana Del Rey</div>
                    </td>
                    <td>Would God Forgive Me If I Only Praise One Deity?</td>
                    <td style="text-align: right;">4:25</td>
                </tr>
            </tbody>
        </table>
    </div>

    
    <div id="player-view">
        <div class="top-nav">
            <button class="back-btn" onclick="showPlaylist()">
                <i class="fa-solid fa-chevron-left"></i> Back
            </button>
            <span style="color: #b3b3b3; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Lyrics</span>
            <div style="width: 45px;"></div>
        </div>

        <div class="now-playing-header">
            <img src="photo123.jfif" alt="Summertime Sadness Cover" class="mini-art">
            <div>
                <h2 style="font-size: 18px;">Summertime Sadness</h2>
                <p style="color: #b3b3b3; font-size: 13px;">Lana Del Rey</p>
            </div>
        </div>

        
        <div id="lyrics-viewport">
            <div id="lyrics-container"></div>
        </div>
    </div>

    
    <div class="bottom-bar">
        <div class="bar-track-info">
            <img src="photo123.jfif" alt="Summertime Sadness Cover" style="width: 42px; height: 42px; border-radius: 4px; object-fit: cover; background-color: #282828; flex-shrink: 0;">
            <div>
                <div style="font-size: 14px; font-weight: 600;" id="bar-title">Summertime Sadness</div>
                <div style="font-size: 12px; color: #b3b3b3;" id="bar-artist">Lana Del Rey</div>
            </div>
        </div>
        <div class="bar-controls">
            <div class="bar-buttons">
                <i class="fa-solid fa-shuffle"></i>
                <i class="fa-solid fa-backward-step"></i>
                <i class="fa-solid fa-circle-play play-pause-bar" id="master-play" onclick="togglePlay()"></i>
                <i class="fa-solid fa-forward-step"></i>
                <i class="fa-solid fa-repeat"></i>
            </div>
            <div class="progress-container">
                <span id="curr-time">0:00</span>
                <div class="progress-bar" onclick="seekTrack(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="total-time">4:25</span>
            </div>
        </div>
        <div style="width: 30%;"></div>
    </div>

    <script>
        const lyricsData = [
            { text: "Would God Forgive Me If I Only Praise One Deity?", isTitle: true },
            { text: "Would God forgive me if I only praised one deity?", isTitle: false },
            { text: "Will He loathe me, for he is my pride and I honor him so much?", isTitle: false },
            { text: "If putting someone above all else is a sin,", isTitle: false },
            { text: "I would gladly accept being a sinner for him.", isTitle: false },
            { text: "", isSpacer: true },
            { text: "Oh Father, if loving him no longer glorifies You,", isTitle: false },
            { text: "Will You be mad at me?", isTitle: false },
            { text: "You taught me how to love a person completely,", isTitle: false },
            { text: "Yet now my devotion has overtaken my faith,", isTitle: false },
            { text: "And I am left wondering if the depth of my affection", isTitle: false },
            { text: "Is a betrayal to Your grace.", isTitle: false },
            { text: "", isSpacer: true },
            { text: "If You were to ask me why I praise him like a deity,", isTitle: false },
            { text: "I would tell You that he carries a light", isTitle: false },
            { text: "That softens the hardest parts of this world.", isTitle: false },
            { text: "His strength is quiet, his presence is a sanctuary,", isTitle: false },
            { text: "And in his eyes, I find the comfort I used to seek only in prayer.", isTitle: false },
            { text: "", isSpacer: true },
            { text: "Father, how could I not admire someone like him?", isTitle: false },
            { text: "You are the one who created his exceptional soul", isTitle: false },
            { text: "And placed him in my life,", isTitle: false },
            { text: "So would I be forgiven if no one else on earth", isTitle: false },
            { text: "Could ever outweigh him in my eyes?", isTitle: false },
            { text: "", isSpacer: true },
            { text: "I never meant to replace You,", isTitle: false },
            { text: "But loving him has become the only way I know how to worship.", isTitle: false },
            { text: "", isSpacer: true },
            { text: "So Father, I have to ask:", isTitle: false },
            { text: "Would I be forgiven if I only praise one deity?", isTitle: true }
        ];

        let isPlaying = false;
        let activeLineIndex = 0;
        let lyricInterval = null;
        const music = document.getElementById("music");
        const lyricsContainer = document.getElementById("lyrics-container");
        const lyricsViewport = document.getElementById("lyrics-viewport");

        function initLyrics() {
            lyricsContainer.innerHTML = "";
            lyricsData.forEach((item, index) => {
                if (item.isSpacer) {
                    const spacer = document.createElement("div");
                    spacer.className = "spacer-line";
                    lyricsContainer.appendChild(spacer);
                } else {
                    const lineDiv = document.createElement("div");
                    lineDiv.className = `lyric-line ${item.isTitle ? 'highlight-title' : ''}`;
                    lineDiv.textContent = item.text;
                    lineDiv.dataset.index = index;
                    lineDiv.onclick = () => jumpToLine(index);
                    lyricsContainer.appendChild(lineDiv);
                }
            });
        }

        initLyrics();

        function playTrack() {
            document.getElementById("playlist-view").style.display = "none";
            document.getElementById("player-view").style.display = "flex";
            
            music.play().then(() => {
                isPlaying = true;
                updatePlayButton();
                startLyricsAutoScroll();
            }).catch(e => console.log("Playback error:", e));
        }

        function showPlaylist() {
            document.getElementById("player-view").style.display = "none";
            document.getElementById("playlist-view").style.display = "flex";
        }

        function togglePlay() {
            if (isPlaying) {
                music.pause();
                isPlaying = false;
                clearInterval(lyricInterval);
            } else {
                music.play();
                isPlaying = true;
                startLyricsAutoScroll();
            }
            updatePlayButton();
        }

        function updatePlayButton() {
            const btn = document.getElementById("master-play");
            if (isPlaying) {
                btn.classList.remove("fa-circle-play");
                btn.classList.add("fa-circle-pause");
            } else {
                btn.classList.remove("fa-circle-pause");
                btn.classList.add("fa-circle-play");
            }
        }

        function jumpToLine(index) {
            activeLineIndex = index;
            highlightActiveLine();
        }

        function highlightActiveLine() {
            const lines = lyricsContainer.querySelectorAll(".lyric-line");
            lines.forEach(line => {
                const idx = parseInt(line.dataset.index);
                if (idx === activeLineIndex) {
                    line.classList.add("active");
                    
                    const viewportRect = lyricsViewport.getBoundingClientRect();
                    const lineRect = line.getBoundingClientRect();
                    const offset = (lineRect.top - viewportRect.top) - (viewportRect.height / 2) + (lineRect.height / 2);
                    
                    lyricsViewport.scrollBy({
                        top: offset,
                        behavior: 'smooth'
                    });
                } else {
                    line.classList.remove("active");
                }
            });
        }

        function startLyricsAutoScroll() {
            clearInterval(lyricInterval);
            highlightActiveLine();

            lyricInterval = setInterval(() => {
                if (!isPlaying) return;
                
                let nextIndex = activeLineIndex + 1;
                while (nextIndex < lyricsData.length && lyricsData[nextIndex].isSpacer) {
                    nextIndex++;
                }

                if (nextIndex < lyricsData.length) {
                    activeLineIndex = nextIndex;
                    highlightActiveLine();
                } else {
                    clearInterval(lyricInterval);
                }
            }, 4000);
        }

        music.addEventListener("timeupdate", () => {
            if (music.duration) {
                const pct = (music.currentTime / music.duration) * 100;
                document.getElementById("progress-fill").style.width = pct + "%";
                
                let mins = Math.floor(music.currentTime / 60);
                let secs = Math.floor(music.currentTime % 60);
                if (secs < 10) secs = "0" + secs;
                document.getElementById("curr-time").textContent = `${mins}:${secs}`;
            }
        });

        function seekTrack(event) {
            const bar = event.currentTarget;
            const clickPosition = event.offsetX;
            const barWidth = bar.clientWidth;
            if (music.duration) {
                music.currentTime = (clickPosition / barWidth) * music.duration;
            }
        }
    </script>
</body>
</html>
